[build-system]
requires = [
    "hatchling >= 1.26",
]
build-backend = "hatchling.build"
[project]
name = "aiocometwifi"
version = "0.0.0"
authors = [
  { name="zerog981", email="zerog981@example.com" },
]
description = "Async library for Eurotronic Comet WiFi thermostats over a caller-supplied MQTT transport."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [

]
classifiers = [
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
license = "GPL-3.0-or-later"
license-files = ["LICEN[CS]E*"]

[project.optional-dependencies]
dev = [
    "build>=1.4",
    "mypy>=1.18",
    "pytest>=9.0",
    "pytest-asyncio>=1.3",
    "pytest-mock>=3.15",
    "pytest-cov>=7.1",
    "bandit>=1.9",
    "pre-commit>=4.5",
    "ruff>=0.15.13",
]

[project.urls]
Homepage = "https://github.com/zerog981/aiocometwifi"
Issues = "https://github.com/zerog981/aiocometwifi/issues"
Changelog = "https://github.com/zerog981/aiocometwifi/blob/main/CHANGELOG.md"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
markers = [
    "asyncio: marks tests as async (deselect with '-m \"not asyncio\"')",
]

[tool.coverage.run]
source = ["aiocometwifi"]
omit = ["*/tests/*"]

[tool.ruff]
required-version = ">=0.15.1"
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203",    # conflicts with D211
    "D213",    # conflicts with D212
    "COM812",  # conflicts with the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004"]  # asserts and magic values are fine in tests

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
files = ["src", "tests"]

[tool.bandit]
exclude_dirs = ["tests"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
changelog_file = 'CHANGELOG.md'
build_command = 'python -m pip install build && python -m build'
allow_zero_version = true
major_on_zero = false

[tool.semantic_release.branches.main]
match = "main"