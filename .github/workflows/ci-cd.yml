name: ci-cd
on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Check-out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install required packages
        run: python -m pip install -r requirements_dev.txt

      - name: Ruff lint
        run: python -m ruff check --output-format=github .

      - name: Ruff format check
        run: python -m ruff format --diff .

      - name: Mypy
        run: python -m mypy

      - name: Perform Bandit Analysis
        run: python -m bandit -r -x "tests" src

      - name: Run unit tests
        run: python -m pytest -v --cov --cov-fail-under=90 --cov-report=term-missing

  cd-build:
    permissions:
      contents: write
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}

    steps:
      - name: Check-out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Checkout full repository for versioning

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Prepare new release
        uses: python-semantic-release/python-semantic-release@v10.5.3
        id: release
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          vcs_release: false

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        if: steps.release.outputs.released == 'true'
        with:
          name: python-package-distributions
          path: dist/

  cd-publish-pypi:
    permissions:
      id-token: write
      contents: read
    needs: cd-build
    if: needs.cd-build.outputs.released == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  cd-github-release:
    permissions:
      contents: write
    needs: [ cd-build, cd-publish-pypi ]
    if: needs.cd-build.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check-out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Publish the GitHub release
        uses: python-semantic-release/publish-action@v10
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ needs.cd-build.outputs.tag }}